[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picturebook"
version = "0.1.0"
description = "Make bilingual picture books: text and image prompts in, print PDFs and an HTML reader out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quinten Yearsley" }]
keywords = ["picture book", "children's book", "pdf", "chinese", "pinyin", "ai art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=11",
    "pypinyin>=0.55",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pre-commit>=4", "ruff>=0.8"]

[project.scripts]
picturebook = "picturebook.cli:main"

[project.urls]
Homepage = "https://github.com/qyearsley/picturebook"
Repository = "https://github.com/qyearsley/picturebook"
Issues = "https://github.com/qyearsley/picturebook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/picturebook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]  # zip() without strict= matches the original behaviour

[tool.ruff.lint.isort]
known-first-party = ["picturebook"]
