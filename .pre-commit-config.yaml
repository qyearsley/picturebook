# Install with `pre-commit install`. CI runs the same checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: no-binaries
        name: no images or PDFs
        entry: scripts/check-no-binaries.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: tests
        name: unit tests
        entry: .venv/bin/python -m unittest discover -s tests
        language: system
        types_or: [python, json]
        pass_filenames: false
